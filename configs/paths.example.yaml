# Environment variables used by the public release. Relative paths are resolved
# from the directory in which a command is launched.
environment:
  MORAP_DATA_ROOT: ./data
  MORAP_CACHE_ROOT: ./data/cache
  MORAP_RESULTS_ROOT: ./outputs
  MORAP_ARCHIVE_ROOT: ./data/archive
  MORAP_MODEL_ROOT: ./data/models

# Expected minimum layout:
# $MORAP_DATA_ROOT/
#   cscc/
#     labels/
#     cohort/       # needed by common-contract comparator workflows
#     derived/      # needed by common-contract comparator workflows
# $MORAP_CACHE_ROOT/
#   cscc/
#     raw_patches/
#     benchmark_patches/
#     ctranspath_context/
#     ctranspath_local/
# $MORAP_RESULTS_ROOT/
#   cscc/folds/
